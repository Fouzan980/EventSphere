server {
    listen 80;
    server_name localhost;

    # Handle the main React application and static asset subpath
    location /projects/eventsphere/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /projects/eventsphere/index.html;
    }

    # Proxy API conduit for backend communication
    location /projects/eventsphere/api/ {
        proxy_pass http://server:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Catch-all fallback safely keeping traffic within the boundary
    location / {
        root /usr/share/nginx/html/projects/eventsphere;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
